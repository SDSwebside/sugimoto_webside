<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f7f4"><meta name="description" content="杉鼎森 CIP 課程報名意向頁。"><title>課程報名｜杉鼎森數位工程</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><script defer src="main.js"></script></head>
<body data-page="cip"><a class="skip-link" href="#main">跳到主要內容</a><div data-site-header></div>
<main id="main"><section class="register-layout container"><div class="register-intro" data-reveal><a class="back-link" href="cip.html">← 返回 CIP 課程</a><span class="eyebrow"><span class="eyebrow__dot"></span> CIP COURSE REGISTRATION</span><h1>一起踏出<br><em>下一步。</em></h1><p>填寫課程報名意向，讓我們了解你想參加的課程。</p><div class="register-course"><span>你選擇的課程</span><strong id="selected-course">課程載入中</strong><small id="selected-description"></small></div><p class="register-disclaimer">目前為報名頁原型，尚未串接正式報名系統。送出按鈕會開啟你裝置上的電子郵件軟體，請確認收件地址後寄出。</p></div><form class="register-form" id="registration-form" data-reveal><span class="eyebrow">YOUR DETAILS</span><h2>留下聯絡資訊</h2><label for="reg-name">姓名／稱呼 <span>*</span></label><input id="reg-name" name="name" autocomplete="name" required placeholder="你的姓名"><label for="reg-email">電子郵件 <span>*</span></label><input id="reg-email" name="email" type="email" autocomplete="email" required placeholder="name@example.com"><label for="reg-phone">聯絡電話</label><input id="reg-phone" name="phone" type="tel" autocomplete="tel" placeholder="09xx xxx xxx"><label for="reg-note">想先告訴我們的事</label><textarea id="reg-note" name="note" rows="4" placeholder="例如：目前的品牌階段、想了解的課程內容"></textarea><button class="button button--dark" type="submit">開啟郵件送出意向 <span aria-hidden="true">↗</span></button><p class="form-note">正式報名網址提供後，可直接替換課程卡片連結。</p></form></section></main><div data-site-footer></div></body></html>
